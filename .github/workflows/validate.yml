name: Validate Marketplace

on:
  push:
    paths:
      - '.claude-plugin/marketplace.json'
      - 'scripts/validate.sh'
      - 'scripts/overlap-report.py'
      - '.github/workflows/validate.yml'
      - .agents/plugins/marketplace.json
      - scripts/sync-codex-marketplace.sh
  pull_request:
    paths:
      - '.claude-plugin/marketplace.json'
      - 'scripts/validate.sh'
      - 'scripts/overlap-report.py'
      - '.github/workflows/validate.yml'
      - .agents/plugins/marketplace.json
      - scripts/sync-codex-marketplace.sh

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate marketplace.json
        run: ./scripts/validate.sh

      - name: Summary
        run: |
          {
            echo "## Plugins in marketplace"
            echo ""
            jq -r '.plugins[] | "- **\(.name)** (\(.category // "uncategorized"))"' \
              .claude-plugin/marketplace.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Overlap report (advisory, non-blocking)
        run: python3 scripts/overlap-report.py | tee overlap-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload overlap report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: overlap-report
          path: overlap-report.md
          if-no-files-found: warn
